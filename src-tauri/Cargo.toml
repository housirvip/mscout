[package]
name = "mem-scanner"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
mem-scanner-core = { path = "../crates/mem-scanner-core" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "mem_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
