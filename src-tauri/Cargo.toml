[package]
name = "mscout"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mscout-gui"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
mscout-core = { path = "../crates/mscout-core" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "mscout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
